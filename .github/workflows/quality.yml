name: Quality

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      CADENCE_DESTINATION: platform=iOS Simulator,name=iPhone Duo,OS=latest
      CADENCE_KEEP_ARTIFACTS: 1
      CADENCE_ARTIFACT_ROOT: /tmp/cadence-quality
    steps:
      - uses: actions/checkout@v6
      - name: Prepare evidence directory
        run: mkdir -p "$CADENCE_ARTIFACT_ROOT"
      - name: Run authoritative quality gate
        run: Scripts/quality.sh 2>&1 | tee "$CADENCE_ARTIFACT_ROOT/quality.log"
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: cadence-quality-${{ github.run_id }}
          path: ${{ runner.temp }}/cadence-quality
          if-no-files-found: warn
          retention-days: 14
